<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f8f5" />
    <meta name="description" content="{{SITE_DESCRIPTION}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{SITE_TITLE}}" />
    <meta property="og:description" content="{{SITE_DESCRIPTION}}" />
    <link rel="canonical" href="{{SITE_URL}}" />
    <link rel="alternate" type="application/rss+xml" title="{{SITE_NAME}}" href="/feed.xml" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/blog.js"></script>
    <script defer src="/app.js"></script>
    <title>{{SITE_TITLE}}</title>
  </head>
  <body>
    <a class="skip-link" href="#main">跳转到正文</a>
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="/" aria-label="{{SITE_NAME}}，首页">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-name">{{SITE_NAME}}<span class="brand-dot">.</span></span>
        </a>
        <nav class="primary-nav" aria-label="主导航">
          <a data-nav="home" href="/">文章</a>
          <a data-nav="archive" href="/archive/">归档</a>
          <a data-nav="tags" href="/tags/">主题</a>
          <a data-nav="about" href="/about/">关于</a>
        </nav>
        <div class="nav-actions">
          <a class="write-link" href="/admin/" aria-label="打开可视化编辑器，写文章">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5M4 20l4.5-1L21 6.5 17.5 3 5 15.5 4 20Z"></path></svg>
            <span>写文章</span>
          </a>
          <a class="icon-button search-shortcut" href="/search/" aria-label="搜索文章" title="搜索文章（/）">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"></circle><path d="m16 16 4.5 4.5"></path></svg>
          </a>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="切换深色主题" title="切换主题">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.8"></circle><path d="M12 2v2.1M12 19.9V22M4.93 4.93l1.48 1.48m11.18 11.18 1.48 1.48M2 12h2.1m15.8 0H22M4.93 19.07l1.48-1.48M17.59 6.41l1.48-1.48"></path></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 15.2A8.8 8.8 0 0 1 8.8 3.4 9 9 0 1 0 20.6 15.2Z"></path></svg>
          </button>
        </div>
      </div>
    </header>
    <main id="main" class="site-main" tabindex="-1">
      <div id="app" aria-live="polite"></div>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <span>© <span id="year">2026</span> {{SITE_NAME}}</span>
        <a class="feed-link" href="/feed.xml"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19v.01M5 5a14 14 0 0 1 14 14M5 11a8 8 0 0 1 8 8"></path></svg>RSS 订阅</a>
        <a href="/admin/">管理博客</a>
        <a href="#main" class="back-top" aria-label="返回顶部">返回顶部 <span aria-hidden="true">↑</span></a>
      </div>
    </footer>
  </body>
</html>
